[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coderoom-docs"
version = "0.1.0"
description = "Documentation dependencies and scripts for CodeRoom"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
