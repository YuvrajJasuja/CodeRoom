site_name: CodeRoom Documentation
site_description: Real-time Collaborative Code Editor Documentation
site_author: CodeRoom Team

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tracking
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Proposal: proposal.md
  - Journals: journals.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
